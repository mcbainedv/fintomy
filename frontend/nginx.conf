server {
    listen 6001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static hashed assets can be cached hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API reverse proxy to the backend service. compose's
    # `depends_on: backend condition: service_healthy` guarantees the name
    # resolves at nginx start. If you ever rebuild *only* the backend and hit a
    # 502, run: `podman compose restart frontend`.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
